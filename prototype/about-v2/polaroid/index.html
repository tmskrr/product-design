<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Обо&nbsp;мне&nbsp;— полароиды</title></head>
<body><main>
<!-- Вариант «Полароиды»: снимки на стене, их можно таскать, тык переворачивает карточку. Фото пока заглушки -->
<section class="ab-wall" data-ab-wall>
  <p class="ab-wall__hint">Таскайте снимки, тык&nbsp;переворачивает. Фото пока заглушки: сюда встанут ваши</p>
  <figure class="ab-pol" style="--x: 6%; --y: 8%; --r: -5deg; --c: #f2d6c9"><div class="ab-pol__in"><div class="ab-pol__front"><img src="/product-design/prototype/about-scenes/photo.jpg" alt="Маргарита" draggable="false"><figcaption>это&nbsp;я</figcaption></div><div class="ab-pol__back"><p>Привет, я&nbsp;Марго. Начинала с&nbsp;текстов, теперь проектирую интерфейсы и&nbsp;проверяю идеи в&nbsp;коде</p></div></div></figure>
  <figure class="ab-pol" style="--x: 34%; --y: 4%; --r: 4deg; --c: #cfe3f3"><div class="ab-pol__in"><div class="ab-pol__front"><span class="ab-pol__ph">фото: прогулка</span><figcaption>чем&nbsp;больше хожу, тем&nbsp;лучше думаю</figcaption></div><div class="ab-pol__back"><p>Долгие прогулки и&nbsp;спорт&nbsp;— удовольствие с&nbsp;пользой. Голова работает лучше в&nbsp;движении</p></div></div></figure>
  <figure class="ab-pol" style="--x: 62%; --y: 10%; --r: -2deg; --c: #e2edc9"><div class="ab-pol__in"><div class="ab-pol__front"><span class="ab-pol__ph">фото: деталь</span><figcaption>замечать красоту</figcaption></div><div class="ab-pol__back"><p>Когда-то специально училась замечать жизнь. Теперь вижу мелочи, мимо которых раньше проходила</p></div></div></figure>
  <figure class="ab-pol" style="--x: 14%; --y: 50%; --r: 3deg; --c: #f6e2a9"><div class="ab-pol__in"><div class="ab-pol__front"><span class="ab-pol__ph">фото: рабочий стол</span><figcaption>ленивый продуктивизм</figcaption></div><div class="ab-pol__back"><p>Лучше один раз&nbsp;продумать систему, чем&nbsp;потом бесконечно исправлять</p></div></div></figure>
  <figure class="ab-pol" style="--x: 44%; --y: 48%; --r: -6deg; --c: #ead1e6"><div class="ab-pol__in"><div class="ab-pol__front"><span class="ab-pol__ph">фото: поезд</span><figcaption>вышла за&nbsp;хлебом</figcaption></div><div class="ab-pol__back"><p>…и&nbsp;уехала в&nbsp;Питер. Оставляйте место для&nbsp;странных желаний</p></div></div></figure>
  <figure class="ab-pol" style="--x: 70%; --y: 52%; --r: 5deg; --c: #d4e6dd"><div class="ab-pol__in"><div class="ab-pol__front"><span class="ab-pol__ph">фото: книги</span><figcaption>копаю до&nbsp;сути</figcaption></div><div class="ab-pol__back"><p>Если что-то заинтересовало, разбираюсь, как&nbsp;оно&nbsp;работает, и&nbsp;пробую сама</p></div></div></figure>
</section>
<style>
.ab-wall { position: relative; min-height: 600px; margin: 0 calc(-1 * clamp(28px, 4vw, 48px)) -40px; overflow: hidden; background: #e9e4da; background-image: radial-gradient(rgba(0,0,0,.05) 1px, transparent 1px); background-size: 6px 6px; touch-action: none; }
.ab-wall__hint { position: absolute; right: 16px; bottom: 12px; left: 16px; margin: 0; color: #7a746a; font-size: 12px; text-align: center; }
.ab-pol { position: absolute; left: var(--x); top: var(--y); width: 180px; margin: 0; transform: translate(var(--dx, 0px), var(--dy, 0px)) rotate(var(--r)); perspective: 800px; cursor: grab; user-select: none; transition: box-shadow .2s ease; }
.ab-pol.is-drag { z-index: 5; cursor: grabbing; }
.ab-pol__in { position: relative; transition: transform .5s cubic-bezier(.3,.7,.3,1); transform-style: preserve-3d; }
.ab-pol.is-flip .ab-pol__in { transform: rotateY(180deg); }
.ab-pol__front, .ab-pol__back { padding: 10px 10px 14px; background: #fffdf8; box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 10px 22px rgba(0,0,0,.14); backface-visibility: hidden; }
.ab-pol.is-drag .ab-pol__front { box-shadow: 0 2px 4px rgba(0,0,0,.14), 0 20px 36px rgba(0,0,0,.22); }
.ab-pol__front img, .ab-pol__ph { display: grid; width: 100%; aspect-ratio: 1; place-items: center; object-fit: cover; background: var(--c); color: rgba(0,0,0,.4); font-size: 12px; pointer-events: none; }
.ab-pol figcaption { margin-top: 10px; color: #3d4447; font: 15px/1.2 "Caveat", "Segoe Print", "Comic Sans MS", cursive; text-align: center; }
.ab-pol__back { position: absolute; inset: 0; display: grid; place-items: center; transform: rotateY(180deg); }
.ab-pol__back p { margin: 0; color: #1f2427; font-size: 14px; line-height: 1.45; text-align: center; }
@media (max-width: 760px) { .ab-wall { min-height: 720px; margin: 0 -18px -28px; } .ab-pol { width: 140px; } .ab-pol:nth-child(odd) { left: calc(var(--x) * .5); } }
</style>
</main></body></html>
