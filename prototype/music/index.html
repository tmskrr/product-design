<style>
.mu { position: relative; display: grid; grid-template-columns: minmax(0, .85fr) minmax(0, 1.15fr); height: min(640px, calc(100vh - 300px)); min-height: 460px; margin: 0 calc(-1 * clamp(28px, 4vw, 48px)) -40px; overflow: hidden; border-top: 1px solid rgba(0,0,0,.08); background: #f2ede4; color: #1d1c1a; }
.mu::before { position: absolute; inset: 0; background: radial-gradient(circle at 18% 50%, color-mix(in srgb, var(--c) 45%, transparent), transparent 60%); content: ""; transition: background .6s ease; pointer-events: none; }
/* Пластинка: половина за левым краем */
.mu-stage { position: relative; }
.mu-disc { position: absolute; top: 50%; right: 6%; width: min(620px, 135%, 118vh); aspect-ratio: 1; transform: translateY(-50%); transition: transform .55s cubic-bezier(.5,0,.2,1), opacity .3s ease; }
.mu-disc.is-out { transform: translate(-70%, -50%) rotate(-40deg); opacity: 0; transition-duration: .35s; }
.mu-disc__vinyl { position: absolute; inset: 0; border-radius: 50%; background: repeating-radial-gradient(circle, #141312 0 1.4px, #1e1d1b 1.4px 3px); box-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 30px 60px rgba(40,30,20,.28); }
.mu-disc__vinyl::after { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 30deg, transparent 0 30deg, rgba(255,255,255,.09) 48deg, transparent 70deg 210deg, rgba(255,255,255,.07) 228deg, transparent 250deg); content: ""; }
.mu.is-playing .mu-disc__vinyl { animation: mu-spin 2.2s linear infinite; }
@keyframes mu-spin { to { transform: rotate(360deg); } }
.mu-disc__label { position: absolute; top: 50%; left: 50%; z-index: 1; display: flex; width: 36%; height: 36%; overflow: hidden; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 14%; border-radius: 50%; transform: translate(-50%, -50%); background: var(--c); color: #1d1c1a; text-align: center; transition: background-color .5s ease; }
.mu-disc__label b { font: 700 clamp(10px, 1.3vw, 15px)/1.05 "IBM Plex Sans", Arial, sans-serif; text-transform: uppercase; letter-spacing: -.01em; }
.mu-disc__label small { font: 500 9px/1 "IBM Plex Mono", monospace; white-space: nowrap; opacity: .65; }
.mu-disc__label::after { position: absolute; top: 50%; left: 50%; width: 8px; height: 8px; margin: -4px; border-radius: 50%; background: #f2ede4; content: ""; }
.mu-dot { position: absolute; top: calc(50% - 6px); right: calc(6% - 6px); width: 12px; height: 12px; border-radius: 50%; background: #e2412b; box-shadow: 0 0 0 4px rgba(226,65,43,.18); }
/* Правая часть */
.mu-side { position: relative; display: flex; min-width: 0; min-height: 0; flex-direction: column; padding: 32px clamp(24px, 4vw, 48px) 28px 8px; }
.mu-kicker { margin: 0 0 8px; color: #6d675c; font: 500 12px/1 "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: .04em; }
.mu-title { margin: 0; font: 800 clamp(30px, 4.4vw, 60px)/.92 "IBM Plex Sans", Arial, sans-serif; letter-spacing: -.045em; text-transform: uppercase; text-wrap: balance; min-height: 1.84em; }
.mu-title.is-long { font-size: clamp(26px, 3.3vw, 44px); }
.mu-ctrl { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 14px; margin: 20px 0 18px; }
.mu-body { position: relative; display: flex; min-height: 0; flex: 1; flex-direction: column; }
.mu-list { min-height: 0; margin: 0; padding: 0; overflow-y: auto; overscroll-behavior: contain; border-top: 1px solid rgba(29,28,26,.16); list-style: none; }
.mu-row { display: grid; grid-template-columns: 34px minmax(0, 1fr) 20px; align-items: center; width: 100%; padding: 8px 4px; border: 0; border-bottom: 1px solid rgba(29,28,26,.1); background: none; color: inherit; font: inherit; font-size: 15px; text-align: left; cursor: pointer; transition: background-color .15s ease, padding .2s ease; }
.mu-row:hover { background: rgba(29,28,26,.04); padding-left: 10px; }
.mu-row__n { color: #8f887b; font: 500 12px/1 "IBM Plex Mono", monospace; }
.mu-row.is-on { font-weight: 700; }
.mu-row.is-on .mu-row__n { color: #e2412b; }
.mu-row__eq { display: none; align-items: flex-end; gap: 2px; height: 12px; }
.mu-row.is-on .mu-row__eq { display: flex; }
.mu-row__eq i { width: 3px; height: 30%; background: #e2412b; }
.mu.is-playing .mu-row.is-on .mu-row__eq i { animation: mu-eq .9s ease-in-out infinite alternate; }
.mu-row__eq i:nth-child(2) { animation-delay: -.3s !important; }
.mu-row__eq i:nth-child(3) { animation-delay: -.6s !important; }
@keyframes mu-eq { from { height: 20%; } to { height: 100%; } }
.mu-row:focus-visible, .mu-btn:focus-visible { outline: 2px solid #e2412b; outline-offset: 2px; }
@media (max-width: 760px) {
  .mu { grid-template-columns: 1fr; height: auto; min-height: 0; margin: 0 -18px -28px; }
  .mu-list { overflow: visible; }
  .mu-stage { height: 200px; }
  .mu-disc { top: auto; right: 50%; bottom: 0; width: 360px; transform: translate(50%, 0); }

  .mu-dot { top: auto; right: calc(50% - 6px); bottom: -6px; }

  .mu-side { padding: 22px 18px 20px; }
  .mu-title, .mu-title.is-long { font-size: clamp(30px, 10vw, 44px); min-height: 0; }
}
@media (prefers-reduced-motion: reduce) { .mu.is-playing .mu-disc__vinyl, .mu.is-playing .mu-row.is-on .mu-row__eq i { animation: none; } .mu-disc { transition: none; } }
/* Кнопки: послушать здесь (плеер Яндекс Музыки) и открыть в приложении */
.mu-open { color: #1d1c1a; font-size: 13px; font-weight: 600; text-decoration: underline; text-decoration-color: rgba(29,28,26,.3); text-underline-offset: 3px; }
.mu-open:hover { color: #e2412b; text-decoration-color: currentColor; }
/* Плеер: появляется только после «Слушать здесь», сам ничего не включает */
.mu-player { display: none; min-height: 0; flex: 1; overflow: hidden; border-radius: 12px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 10px 30px rgba(40,30,20,.12); }
.mu-player iframe { display: block; width: 100%; height: 100%; border: 0; }
.mu.is-player .mu-player { display: block; }
.mu.is-player .mu-list { display: none; }
/* в режиме плеера заголовок компактнее: место отдаём списку треков */
.mu.is-player .mu-title { min-height: 0; font-size: clamp(24px, 2.6vw, 36px); }
.mu.is-player .mu-ctrl { margin: 14px 0 14px; }
.mu-row__eq { display: none !important; }
@media (max-width: 760px) { .mu-player { height: 460px; flex: none; } .mu.is-player .mu-title { font-size: 28px; } }
/* строка плейлиста: при наведении стрелка «играть» */
.mu-row::after { grid-column: 3; justify-self: end; width: 0; height: 0; border-style: solid; border-width: 5px 0 5px 8px; border-color: transparent transparent transparent #e2412b; opacity: 0; content: ""; transition: opacity .15s ease; }
.mu-row:hover::after, .mu-row:focus-visible::after { opacity: 1; }
/* одна случайная песня: плееру хватает шапки с названием */
.mu.is-track .mu-player { height: 230px; flex: none; }
/* Кнопки одной высоты, иконки контурные 1.7, как «стереть» в раскраске на рабочем столе */
.mu-btn { display: inline-flex; height: 40px; align-items: center; gap: 8px; padding: 0 16px 0 14px; border: 1px solid rgba(29,28,26,.22); border-radius: 999px; background: none; color: #1d1c1a; font: inherit; font-size: 14px; font-weight: 600; line-height: 1; cursor: pointer; transition: background-color .15s ease, border-color .15s ease; }
.mu-btn svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.mu-btn:hover { background: rgba(29,28,26,.06); }
.mu-btn--dark { border-color: #1d1c1a; background: #1d1c1a; color: #f2ede4; }
.mu-btn--dark:hover { border-color: #000; background: #000; }
.mu-back { display: none; }
.mu.is-player .mu-back { display: inline-flex; }
/* наклейка: название сверху, номер снизу, дырка посередине между ними */
.mu-disc__label { display: grid; grid-template-rows: 1fr 16px 1fr; justify-items: center; gap: 0; padding: 12% 11%; }
.mu-disc__label b { align-self: end; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; }
.mu-disc__label.is-long b { font-size: clamp(9px, 1vw, 12px); }
.mu-disc__label small { grid-row: 3; align-self: start; padding-top: 2px; }
